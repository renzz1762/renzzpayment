<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>探す — Anime Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #121014;
    --panel: #1c1a1f;
    --panel-line: #322f36;
    --bone: #ede9e2;
    --muted: #948e93;
    --hanko: #c8102e;
    --hanko-dim: #7a0d1e;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--bone);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    min-height: 100vh;
  }

  ::selection { background: var(--hanko); color: var(--bone); }

  header {
    padding: 64px 24px 40px;
    max-width: 960px;
    margin: 0 auto;
    border-bottom: 1px solid var(--panel-line);
  }

  .kanji {
    font-family: 'Shippori Mincho', serif;
    font-size: 15px;
    color: var(--hanko);
    letter-spacing: 0.15em;
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: clamp(36px, 6vw, 56px);
    margin: 0 0 12px;
    line-height: 1.1;
  }

  header p {
    color: var(--muted);
    font-size: 16px;
    max-width: 480px;
    line-height: 1.6;
    margin: 0 0 32px;
  }

  form {
    display: flex;
    gap: 0;
    max-width: 520px;
    border: 1px solid var(--panel-line);
  }

  input[type="text"] {
    flex: 1;
    background: transparent;
    border: none;
    padding: 14px 16px;
    color: var(--bone);
    font-family: inherit;
    font-size: 15px;
    outline: none;
  }

  input[type="text"]::placeholder { color: var(--muted); }

  button {
    background: var(--hanko);
    color: var(--bone);
    border: none;
    padding: 14px 28px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover { background: var(--hanko-dim); }
  button:disabled { background: var(--panel-line); cursor: not-allowed; }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 24px 100px;
  }

  .status {
    color: var(--muted);
    font-size: 14px;
    padding: 20px 0;
  }

  .status.error { color: var(--hanko); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 1px;
    background: var(--panel-line);
    border: 1px solid var(--panel-line);
  }

  .card {
    background: var(--panel);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    transition: background 0.15s ease;
  }

  .card:hover { background: #232025; }

  .card img {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    display: block;
  }

  .card-body { padding: 12px 14px 16px; flex: 1; }

  .card-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.35;
    margin: 0 0 8px;
  }

  .card-meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }

  .card-meta .score { color: var(--hanko); font-weight: 700; }

  /* Detail panel */
  .detail {
    display: none;
    border: 1px solid var(--panel-line);
    background: var(--panel);
    margin-top: 32px;
  }

  .detail.open { display: block; }

  .detail-top {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 28px;
    padding: 28px;
    border-bottom: 1px solid var(--panel-line);
  }

  .detail-top img {
    width: 100%;
    border: 1px solid var(--panel-line);
  }

  .detail-close {
    background: transparent;
    border: 1px solid var(--panel-line);
    color: var(--muted);
    padding: 6px 14px;
    font-size: 13px;
    margin-bottom: 16px;
  }

  .detail-close:hover { color: var(--bone); border-color: var(--bone); }

  .detail h2 {
    font-family: 'Shippori Mincho', serif;
    font-size: 24px;
    margin: 0 0 4px;
  }

  .detail .jp-title { color: var(--muted); font-size: 14px; margin: 0 0 16px; }

  .tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }

  .tag {
    font-size: 12px;
    border: 1px solid var(--panel-line);
    color: var(--muted);
    padding: 4px 10px;
  }

  .facts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }

  .fact-label { font-size: 11px; color: var(--muted); letter-spacing: 0.05em; }
  .fact-value { font-size: 15px; font-weight: 500; }

  .synopsis {
    padding: 24px 28px;
    font-size: 14px;
    line-height: 1.7;
    color: #cfcad2;
    max-width: 68ch;
  }

  .watch-note {
    margin: 0 28px 28px;
    padding: 14px 16px;
    border-left: 2px solid var(--hanko);
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
  }

  .watch-note a { color: var(--bone); }

  @media (max-width: 560px) {
    .detail-top { grid-template-columns: 1fr; }
    .detail-top img { max-width: 160px; }
  }
</style>
</head>
<body>

<header>
  <p class="kanji">探す — sagasu, "mencari"</p>
  <h1>Anime Finder</h1>
  <p>Cari judul anime dan lihat sinopsis, skor, serta daftar episodenya. Data dari MyAnimeList lewat Jikan API.</p>
  <form id="search-form">
    <input type="text" id="search-input" placeholder="Judul anime, mis. Kimetsu no Yaiba" autocomplete="off" />
    <button type="submit">Cari</button>
  </form>
</header>

<main>
  <div id="status" class="status">Ketik judul anime lalu tekan Cari.</div>
  <div id="grid" class="grid" style="display:none;"></div>
  <div id="detail" class="detail"></div>
</main>

<script>
  const form = document.getElementById('search-form');
  const input = document.getElementById('search-input');
  const statusEl = document.getElementById('status');
  const grid = document.getElementById('grid');
  const detail = document.getElementById('detail');

  function setStatus(text, isError = false) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (isError ? ' error' : '');
    statusEl.style.display = text ? 'block' : 'none';
  }

  function renderResults(items) {
    if (!items.length) {
      grid.style.display = 'none';
      setStatus('Tidak ada hasil ditemukan.');
      return;
    }
    setStatus('');
    grid.style.display = 'grid';
    grid.innerHTML = items.map(anime => `
      <div class="card" data-id="${anime.mal_id}">
        <img src="${anime.images?.jpg?.image_url || ''}" alt="${anime.title}" loading="lazy" />
        <div class="card-body">
          <p class="card-title">${anime.title}</p>
          <div class="card-meta">
            <span>${anime.type || '—'} · ${anime.episodes ?? '?'} eps</span>
            <span class="score">${anime.score ?? '—'}</span>
          </div>
        </div>
      </div>
    `).join('');

    grid.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => loadDetail(card.dataset.id));
    });
  }

  async function searchAnime(query) {
    setStatus('Mencari...');
    grid.style.display = 'none';
    detail.classList.remove('open');
    try {
      const res = await fetch(`/api/api?action=search&q=${encodeURIComponent(query)}&limit=12`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Gagal mencari anime');
      renderResults(data.data || []);
    } catch (err) {
      setStatus(err.message, true);
    }
  }

  async function loadDetail(id) {
    detail.classList.add('open');
    detail.innerHTML = '<div class="status">Memuat detail...</div>';
    detail.scrollIntoView({ behavior: 'smooth', block: 'start' });

    try {
      const res = await fetch(`/api/api?action=detail&id=${id}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Gagal memuat detail');
      renderDetail(data.data);
    } catch (err) {
      detail.innerHTML = `<div class="status error" style="padding:24px;">${err.message}</div>`;
    }
  }

  function renderDetail(a) {
    const genres = (a.genres || []).map(g => `<span class="tag">${g.name}</span>`).join('');
    const studios = (a.studios || []).map(s => s.name).join(', ') || '—';
    const malSearchUrl = `https://myanimelist.net/anime.php?q=${encodeURIComponent(a.title)}`;

    detail.innerHTML = `
      <div class="detail-top">
        <img src="${a.images?.jpg?.image_url || ''}" alt="${a.title}" />
        <div>
          <button class="detail-close" id="close-detail">← Tutup</button>
          <h2>${a.title}</h2>
          <p class="jp-title">${a.title_japanese || ''}</p>
          <div class="tag-row">${genres}</div>
          <div class="facts">
            <div><div class="fact-label">TIPE</div><div class="fact-value">${a.type || '—'}</div></div>
            <div><div class="fact-label">EPISODE</div><div class="fact-value">${a.episodes ?? '—'}</div></div>
            <div><div class="fact-label">STATUS</div><div class="fact-value">${a.status || '—'}</div></div>
            <div><div class="fact-label">SKOR</div><div class="fact-value">${a.score ?? '—'}</div></div>
            <div><div class="fact-label">TAYANG</div><div class="fact-value">${a.aired?.string || '—'}</div></div>
            <div><div class="fact-label">STUDIO</div><div class="fact-value">${studios}</div></div>
          </div>
        </div>
      </div>
      <p class="synopsis">${a.synopsis ? a.synopsis.replace(/\n/g, '<br>') : 'Sinopsis tidak tersedia.'}</p>
      <p class="watch-note">
        Ini cuma data (bukan pemutar video). Untuk nonton legal, cari judul ini di
        <a href="https://www.crunchyroll.com/search?q=${encodeURIComponent(a.title)}" target="_blank" rel="noopener">Crunchyroll</a>,
        <a href="https://www.bilibili.tv/en/search?q=${encodeURIComponent(a.title)}" target="_blank" rel="noopener">Bstation</a>,
        atau <a href="${malSearchUrl}" target="_blank" rel="noopener">MyAnimeList</a>.
      </p>
    `;

    document.getElementById('close-detail').addEventListener('click', () => {
      detail.classList.remove('open');
      detail.innerHTML = '';
    });
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (q) searchAnime(q);
  });
</script>

</body>
</html>
