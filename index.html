<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonton Anime • Tanpa NPM</title>
    <!-- Font & Icon -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0e14;
            font-family: 'Inter', sans-serif;
            color: #eef2f6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #2a2f3a;
            padding-bottom: 20px;
        }

        .logo h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(145deg, #facc15, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .logo span {
            font-weight: 400;
            font-size: 0.9rem;
            color: #8892a0;
            -webkit-text-fill-color: #8892a0;
            background: none;
            margin-left: 8px;
        }

        .search-box {
            display: flex;
            background: #1e232b;
            border-radius: 40px;
            padding: 6px 6px 6px 18px;
            align-items: center;
            border: 1px solid #313844;
            transition: 0.2s;
        }

        .search-box:focus-within {
            border-color: #facc15;
            box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.2);
        }

        .search-box i {
            color: #7a8496;
            font-size: 0.95rem;
        }

        .search-box input {
            background: transparent;
            border: none;
            padding: 10px 12px;
            font-size: 0.95rem;
            color: #f0f4fa;
            width: 220px;
            outline: none;
        }

        .search-box input::placeholder {
            color: #5d6779;
        }

        .search-box button {
            background: #facc15;
            border: none;
            border-radius: 30px;
            padding: 8px 18px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #0b0e14;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-box button:hover {
            background: #fbbf24;
            transform: scale(0.96);
        }

        /* GRID HURUF */
        .alpha-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .alpha-btn {
            background: #171d26;
            border: 1px solid #2b323e;
            color: #bcc3d0;
            padding: 8px 14px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
            min-width: 40px;
            text-align: center;
        }

        .alpha-btn:hover {
            background: #2d3543;
            color: white;
            border-color: #facc15;
        }

        .alpha-btn.active {
            background: #facc15;
            color: #0b0e14;
            border-color: #facc15;
            font-weight: 700;
        }

        /* ANIME LIST */
        .anime-section {
            margin-top: 10px;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 28px 0 16px 0;
            padding-left: 6px;
            border-left: 5px solid #facc15;
            padding-left: 14px;
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
        }

        .anime-card {
            background: #151c26;
            border-radius: 18px;
            padding: 14px 16px;
            border: 1px solid #242c38;
            transition: 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: default;
        }

        .anime-card:hover {
            background: #1e2735;
            border-color: #facc15;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .anime-title {
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.3;
            color: #f0f5fc;
        }

        .anime-title i {
            color: #facc15;
            margin-right: 6px;
            font-size: 0.75rem;
        }

        .anime-link {
            font-size: 0.75rem;
            color: #8f9bb3;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            text-decoration: none;
            transition: 0.15s;
        }

        .anime-link i {
            font-size: 0.7rem;
            color: #facc15;
        }

        .anime-link:hover {
            color: #facc15;
        }

        .badge-id {
            background: #1f2a37;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            color: #b0bedb;
            align-self: flex-start;
            margin-top: 4px;
            letter-spacing: 0.3px;
        }

        /* empty state */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #6b7a8f;
        }

        .footer {
            margin-top: 50px;
            border-top: 1px solid #1f2733;
            padding-top: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: #54616f;
        }

        .footer i {
            color: #facc15;
        }

        /* responsive */
        @media (max-width: 640px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
            }
            .search-box {
                width: 100%;
            }
            .search-box input {
                width: 100%;
            }
            .anime-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
            .alpha-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
                min-width: 34px;
            }
        }
    </style>
</head>
<body>

      ]
    },
    {
      "startWith": "A",
      "animeList": [
        { "title": "A-Channel", "animeId": "channel-subtitle-indonesia", "href": "/anime/anime/channel-subtitle-indonesia", "otakudesuUrl": "https://otakudesu.blog/anime/channel-subtitle-indonesia/" },
        { "title": "A-Rank Party wo Ridatsu shita Ore wa", "animeId": "a-rank-party-sub-indo", "href": "/anime/anime/a-rank-party-sub-indo", "otakudesuUrl": "https://otakudesu.blog/anime/a-rank-party-sub-indo/" },
        { "title": "AICO Incarnation", "animeId": "aico-incarnation-subtitle-indonesia", "href": "/anime/anime/aico-incarnation-subtitle-indonesia", "otakudesuUrl": "https://otakudesu.blog/anime/aico-incarnation-subtitle-indonesia/" },
        { "title": "Absolute Duo", "animeId": "absol-duo-subtitle-indonesia", "href": "/anime/anime/absol-duo-subtitle-indonesia", "otakudesuUrl": "https://otakudesu.blog/anime/absol-duo-subtitle-indonesia/" },
        { "title": "ACCA: 13-ku Kansatsu-ka", "animeId": "acca-13-kansatsu-subtitle-indonesia", "href": "/anime/anime/acca-13-kansatsu-subtitle-indonesia", "otakudesuUrl": "https://otakudesu.blog/anime/acca-13-kansatsu-subtitle-indonesia/" },

        { "title": "Aharen-san wa Hakarenai Season 2", "animeId": "aharen-s2-sub-indo", "href": "/anime/anime/aharen-s2-sub-indo", "otakudesuUrl": "https://otakudesu.blog/anime/aharen-s2-sub-indo/" },

    // flatten all anime into one array with startWith info
    const allAnime = [];
    const alphaMap = new Map(); // key: startWith, value: [anime, ...]

    animeData.list.forEach(group => {
        const key = group.startWith;
        if (!alphaMap.has(key)) alphaMap.set(key, []);
        group.animeList.forEach(anime => {
            const entry = { ...anime, startWith: key };
            alphaMap.get(key).push(entry);
            allAnime.push(entry);
        });
    });

    // sort keys (biar rapi)
    const sortedKeys = Array.from(alphaMap.keys()).sort((a, b) => {
        if (a === '#') return -1;
        if (b === '#') return 1;
        if (a === '�') return 1; // Ubel Blatt
        if (b === '�') return -1;
        return a.localeCompare(b);
    });

    // ----- RENDER -----
    const alphaNav = document.getElementById('alphaNav');
    const container = document.getElementById('animeContainer');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');

    let currentActive = '#';

    // fungsi render berdasarkan huruf
    function renderByLetter(letter) {
        currentActive = letter;
        // update active class
        document.querySelectorAll('.alpha-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.letter === letter);
        });

        const list = alphaMap.get(letter) || [];
        if (list.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-box-open" style="font-size:2rem; opacity:0.3;"></i><p style="margin-top:12px;">Tidak ada anime dengan awalan "${letter}"</p></div>`;
            return;
        }

        let html = `<div class="section-title"><i class="fas fa-list-ul" style="margin-right:10px; color:#facc15;"></i> ${letter}</div>`;
        html += `<div class="anime-grid">`;
        list.forEach(anime => {
            html += `
                <div class="anime-card">
                    <div class="anime-title"><i class="fas fa-play-circle"></i> ${anime.title}</div>
                    <a href="${anime.otakudesuUrl}" target="_blank" class="anime-link">
                        <i class="fas fa-external-link-alt"></i> tonton
                    </a>
                    <span class="badge-id">${anime.animeId}</span>
                </div>
            `;
        });
        html += `</div>`;
        container.innerHTML = html;
    }

    // buat tombol huruf
    sortedKeys.forEach(key => {
        const btn = document.createElement('button');
        btn.className = 'alpha-btn';
        if (key === currentActive) btn.classList.add('active');
        btn.textContent = key;
        btn.dataset.letter = key;
        btn.addEventListener('click', () => {
            renderByLetter(key);
            searchInput.value = '';
        });
        alphaNav.appendChild(btn);
    });

    // default render
    renderByLetter('#');

    // ----- SEARCH -----
    function performSearch() {
        const query = searchInput.value.trim().toLowerCase();
        if (!query) {
            // fallback ke huruf aktif
            renderByLetter(currentActive);
            return;
        }

        const results = allAnime.filter(anime => 
            anime.title.toLowerCase().includes(query)
        );

        if (results.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-search" style="font-size:2rem; opacity:0.3;"></i><p style="margin-top:12px;">Tidak ketemu “${searchInput.value}”</p></div>`;
            return;
        }

        // tampilkan hasil
        let html = `<div class="section-title"><i class="fas fa-search" style="margin-right:10px; color:#facc15;"></i> Hasil untuk “${searchInput.value}” (${results.length})</div>`;
        html += `<div class="anime-grid">`;
        results.forEach(anime => {
            html += `
                <div class="anime-card">
                    <div class="anime-title"><i class="fas fa-play-circle"></i> ${anime.title}</div>
                    <a href="${anime.otakudesuUrl}" target="_blank" class="anime-link">
                        <i class="fas fa-external-link-alt"></i> tonton
                    </a>
                    <span class="badge-id">${anime.animeId}</span>
                </div>
            `;
        });
        html += `</div>`;
        container.innerHTML = html;
    }

    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') performSearch();
    });

    // tambahan: klik di luar search reset ke huruf aktif? biarkan saja.
</script>
</body>
</html>
