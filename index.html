<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>MENTAHAN STUDIO — GFX & Anime Edit</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="logo"><i class="fa-solid fa-clapperboard"></i> MENTAHAN<span>STUDIO</span></div>
  <div class="topbar-sub">◈ Mentahan Video • Bahan GFX • Background — Siap Edit ◈</div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="video" onclick="switchTab('video',this)"><i class="fa-solid fa-video"></i> Mentahan Video</button>
  <button class="tab-btn" data-tab="gfx" onclick="switchTab('gfx',this)"><i class="fa-solid fa-layer-group"></i> Bahan GFX</button>
  <button class="tab-btn" data-tab="bg" onclick="switchTab('bg',this)"><i class="fa-solid fa-mountain-sun"></i> Background GFX</button>
</nav>

<main>
  <section id="tab-video" class="tab-panel active">
    <div class="search-row">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchVideo" placeholder="Cari mentahan video..." oninput="renderVideos()">
    </div>
    <div class="grid" id="videoGrid"></div>
  </section>

  <section id="tab-gfx" class="tab-panel">
    <div class="search-row">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchGfx" placeholder="Cari bahan GFX..." oninput="renderGfx()">
    </div>
    <div class="grid" id="gfxGrid"></div>
  </section>

  <section id="tab-bg" class="tab-panel">
    <div class="search-row">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchBg" placeholder="Cari background GFX..." oninput="renderBg()">
    </div>
    <div class="grid" id="bgGrid"></div>
  </section>
</main>

<div class="lightbox" id="imgLightbox" onclick="closeLightbox(event)">
  <div class="lightbox-box" onclick="event.stopPropagation()">
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-title" id="lightboxTitle"></div>
    <div class="lightbox-actions">
      <button class="btn-download" id="lightboxDownloadBtn"><i class="fa-solid fa-download"></i> Download</button>
      <button class="btn-close" onclick="closeLightbox(event)"><i class="fa-solid fa-xmark"></i> Tutup</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<footer class="site-footer">© <span id="yearNow"></span> MENTAHAN STUDIO — Semua bahan untuk keperluan edit.</footer>

<script src="product.js"></script>
<script src="bahangfx.js"></script>
<script src="backgroundgfx.js"></script>
<script src="main.js"></script>
</body>
</html>
