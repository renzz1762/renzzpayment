<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reach WA Nexus - Auto Send</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e1e2f;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        h1 {
            color: #a855f7;
            text-align: center;
            margin-bottom: 5px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #ccc;
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            background: #2a2a3e;
            border: 2px solid #333;
            border-radius: 10px;
            font-size: 14px;
            color: #fff;
            transition: all 0.3s;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            padding: 10px 20px;
            background: #2a2a3e;
            color: #ccc;
            border: 2px solid #333;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: #333;
            color: #fff;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .button-group .btn-primary {
            flex: 2;
        }

        .button-group .btn-secondary {
            flex: 1;
        }

        .log-container {
            margin-top: 20px;
            background: #0d0d1a;
            color: #00ff88;
            padding: 15px;
            border-radius: 10px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
            border: 1px solid #1a1a2e;
        }

        .log-container .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .log-container .success {
            color: #00ff88;
        }

        .log-container .error {
            color: #ff6b6b;
        }

        .log-container .info {
            color: #4fc3f7;
        }

        .log-container .warning {
            color: #ffd93d;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }

        .stat-box {
            background: #15152a;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #2a2a3e;
        }

        .stat-box .number {
            font-size: 28px;
            font-weight: 700;
            color: #a855f7;
        }

        .stat-box .label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .stat-box.success .number {
            color: #00c851;
        }

        .stat-box.error .number {
            color: #ff4444;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #a855f7;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            color: #ccc;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0d0d1a;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #a855f7;
            border-radius: 10px;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Reach WA Nexus</h1>
        <p class="subtitle">Auto Send Reaction Channel WhatsApp | Deploy Sendiri</p>

        <div class="form-group">
            <label>🔗 URL Channel WhatsApp</label>
            <input type="text" id="channelUrl" value="https://whatsapp.com/channel/0029VbAYjQgKrWQulDTYcg2K/1728" placeholder="https://whatsapp.com/channel/...">
        </div>

        <div class="form-group">
            <label>😊 Reactions (pisahkan dengan koma)</label>
            <textarea id="reactions" rows="2">😆, 🥶, 🔥, ❤️, 👍</textarea>
        </div>

        <div class="form-group">
            <label>⚙️ Jumlah Pengiriman</label>
            <input type="number" id="totalSends" value="10" min="1" max="100">
        </div>

        <div class="form-group">
            <label>⏱️ Delay (detik)</label>
            <input type="number" id="delaySeconds" value="5" min="2" max="30">
        </div>

        <div class="form-group">
            <div class="checkbox-group">
                <input type="checkbox" id="useProxy">
                <label for="useProxy">🌐 Gunakan Proxy</label>
            </div>
        </div>

        <div class="form-group">
            <div class="checkbox-group">
                <input type="checkbox" id="autoRetry" checked>
                <label for="autoRetry">🔄 Auto Retry (3x)</label>
            </div>
        </div>

        <div class="button-group">
            <button class="btn-primary" id="startBtn">▶️ Mulai Kirim</button>
            <button class="btn-secondary" id="stopBtn" style="display:none;">⏹️ Stop</button>
            <button class="btn-secondary" id="clearLogBtn">🗑️ Clear</button>
        </div>

        <div class="stats">
            <div class="stat-box success">
                <div class="number" id="successCount">0</div>
                <div class="label">✅ Berhasil</div>
            </div>
            <div class="stat-box error">
                <div class="number" id="failCount">0</div>
                <div class="label">❌ Gagal</div>
            </div>
            <div class="stat-box">
                <div class="number" id="totalCount">0</div>
                <div class="label">📊 Total</div>
            </div>
            <div class="stat-box">
                <div class="number" id="retryCount">0</div>
                <div class="label">🔄 Retry</div>
            </div>
        </div>

        <div class="log-container" id="logContainer">
            <div class="log-entry info">🔄 System ready...</div>
        </div>
    </div>

    <script>
        // =============================================
        // REACH WA NEXUS - FRONTEND
        // =============================================

        class ReachWAAutomation {
            constructor() {
                this.isRunning = false;
                this.shouldStop = false;
                this.successCount = 0;
                this.failCount = 0;
                this.totalCount = 0;
                this.retryCount = 0;
                
                this.channelUrl = document.getElementById('channelUrl');
                this.reactions = document.getElementById('reactions');
                this.totalSends = document.getElementById('totalSends');
                this.delaySeconds = document.getElementById('delaySeconds');
                this.useProxy = document.getElementById('useProxy');
                this.autoRetry = document.getElementById('autoRetry');
                
                this.startBtn = document.getElementById('startBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.clearLogBtn = document.getElementById('clearLogBtn');
                
                this.logContainer = document.getElementById('logContainer');
                this.successCountEl = document.getElementById('successCount');
                this.failCountEl = document.getElementById('failCount');
                this.totalCountEl = document.getElementById('totalCount');
                this.retryCountEl = document.getElementById('retryCount');

                this.bindEvents();
                this.updateStats();
            }

            bindEvents() {
                this.startBtn.addEventListener('click', () => this.startAutomation());
                this.stopBtn.addEventListener('click', () => this.stopAutomation());
                this.clearLogBtn.addEventListener('click', () => this.clearLog());
            }

            async startAutomation() {
                if (this.isRunning) return;

                const url = this.channelUrl.value.trim();
                const reactionsRaw = this.reactions.value;
                const reactions = reactionsRaw.split(',').map(r => r.trim()).filter(r => r);
                const total = parseInt(this.totalSends.value) || 10;
                const delay = (parseInt(this.delaySeconds.value) || 5) * 1000;
                const useProxy = this.useProxy.checked;
                const autoRetry = this.autoRetry.checked;

                if (!url) {
                    this.log('❌ Masukkan URL channel!', 'error');
                    return;
                }

                if (reactions.length === 0) {
                    this.log('❌ Masukkan minimal 1 reaction!', 'error');
                    return;
                }

                this.isRunning = true;
                this.shouldStop = false;
                this.successCount = 0;
                this.failCount = 0;
                this.totalCount = 0;
                this.retryCount = 0;
                this.updateStats();

                this.startBtn.disabled = true;
                this.startBtn.innerHTML = '⏳ <span class="loading-spinner"></span> Running...';
                this.stopBtn.style.display = 'inline-block';

                this.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
                this.log(`🚀 Target: ${url}`, 'info');
                this.log(`📝 Reactions: ${reactions.join(', ')}`, 'info');
                this.log(`📊 Total: ${total}`, 'info');
                this.log(`🌐 Proxy: ${useProxy ? 'On' : 'Off'}`, 'info');
                this.log(`🔄 Auto Retry: ${autoRetry ? 'On' : 'Off'}`, 'info');
                this.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');

                for (let i = 0; i < total; i++) {
                    if (this.shouldStop) {
                        this.log('⏹️ Dihentikan user', 'error');
                        break;
                    }

                    this.totalCount++;
                    let attempt = 0;
                    let maxAttempts = autoRetry ? 3 : 1;
                    let success = false;

                    while (attempt < maxAttempts && !success && !this.shouldStop) {
                        attempt++;
                        if (attempt > 1) {
                            this.retryCount++;
                            this.log(`🔄 Retry ${attempt-1}...`, 'warning');
                        }

                        this.log(`📤 [${this.totalCount}/${total}] Attempt ${attempt}`, 'info');

                        try {
                            const result = await this.callAPI(url, reactions, useProxy);
                            
                            if (result.success) {
                                success = true;
                                this.successCount++;
                                this.log(`✅ Berhasil!`, 'success');
                                this.log(`   👤 ${result.usernameUsed}`, 'success');
                            } else {
                                this.log(`❌ Gagal: ${result.error}`, 'error');
                                if (!autoRetry || attempt >= maxAttempts) {
                                    this.failCount++;
                                }
                            }
                        } catch (error) {
                            this.log(`❌ Error: ${error.message}`, 'error');
                            if (!autoRetry || attempt >= maxAttempts) {
                                this.failCount++;
                            }
                        }

                        this.updateStats();

                        if (!success && attempt < maxAttempts && !this.shouldStop) {
                            await this.sleep(2000);
                        }
                    }

                    if (i < total - 1 && !this.shouldStop) {
                        await this.sleep(delay);
                    }
                }

                this.isRunning = false;
                this.startBtn.disabled = false;
                this.startBtn.textContent = '▶️ Mulai Kirim';
                this.stopBtn.style.display = 'none';

                this.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
                this.log(`🏁 Selesai! ✅${this.successCount} ❌${this.failCount}`, 'info');
            }

            async callAPI(channelUrl, reactions, useProxy) {
                const response = await fetch('/api/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        channelUrl,
                        reactions,
                        useProxy
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'API error');
                }

                return await response.json();
            }

            stopAutomation() {
                this.shouldStop = true;
                this.log('⏹️ Stopping...', 'error');
            }

            sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            log(message, type = 'info') {
                const entry = document.createElement('div');
                entry.className = `log-entry ${type}`;
                const timestamp = new Date().toLocaleTimeString();
                entry.textContent = `[${timestamp}] ${message}`;
                this.logContainer.appendChild(entry);
                this.logContainer.scrollTop = this.logContainer.scrollHeight;
            }

            clearLog() {
                this.logContainer.innerHTML = '';
                this.log('🗑️ Log cleared', 'info');
            }

            updateStats() {
                this.successCountEl.textContent = this.successCount;
                this.failCountEl.textContent = this.failCount;
                this.totalCountEl.textContent = this.totalCount;
                this.retryCountEl.textContent = this.retryCount;
            }
        }

        const automation = new ReachWAAutomation();
    </script>
</body>
</html>
